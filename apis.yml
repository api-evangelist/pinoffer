aid: pinoffer
name: Pinoffer
description: >-
  Pinoffer is the API Evangelist network profile for Convertedin (converted.in /
  convertedin.com), the MENA-focused marketing operating system for e-commerce
  founded in Cairo in 2019 by Mohamed Fergany, Mohamed Atef and Mustafa Raslan.
  "PinOffer" is the company's former name and is still the identifier used by 500
  Global, Crunchbase, MAGNiTT and LinkedIn, which is why the network entry carries
  it. Backed by Merak Capital, 500 Global and MSAS, Convertedin operates across
  Egypt, Saudi Arabia, the UAE and Brazil, and sells a unified growth platform
  covering store analytics, a commerce pixel, segmentation, SMS and email
  automation, and multi-channel ad buying on Meta, TikTok, Snapchat and Google —
  plus the Converted Pay, Flyerz, Leads and Orders products. Convertedin DOES run a
  public developer program at developer.converted.in, contrary to the earlier
  enrichment pass on this repo: it publishes an llms.txt-indexed documentation set
  covering a live webhook ingest API at app.converted.in, two merchant-implemented
  data-sync contracts (Store Connector and Loyalty/POS), a browser pixel SDK,
  first-party Android and iOS SDKs, and a Flyerz DSP iframe embed. What it does not
  publish is any machine-readable contract — no OpenAPI, AsyncAPI, GraphQL schema,
  MCP server or agent card exists on any Convertedin host.
