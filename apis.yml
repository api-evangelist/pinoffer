aid: pinoffer
name: Pinoffer
description: >-
  Pinoffer is the API Evangelist network profile for Converted (convertedin.com),
  a MENA-focused adtech and martech "unified growth platform" operating across
  Egypt, Saudi Arabia, and the UAE. Founded by Mohamed Fergany, Mohamed Atef, and
  Mustafa Raslan, and backed by 500 Global, Converted helps 10,000+ businesses in
  emerging markets manage marketing data, ad payments, lead generation, and order
  intelligence across Google, Meta, TikTok, and other channels through a single
  interface. Its products include Converted Pay (ad credit, local invoicing, and
  spend policies), Flyerz, Leads, and Orders. Converted is a Google Premier Partner
  and a Deloitte Fast 50 company. As of this enrichment pass Converted publishes no
  public developer API, documentation portal, or SDK program; this profile is
  identity-and-domain-security only.
