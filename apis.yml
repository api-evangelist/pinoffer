apis:
- name: Convertedin Webhook Ingest API
  description: >-
    The one API surface Convertedin hosts itself. A merchant's storefront (Magento,
    Salla, or a custom platform) POSTs commerce events into Convertedin —
    orders, customers, products, collections, and app uninstall — authenticated
    with a static `token` header plus an `X-Shop-Domain` header naming the sending
    store. Thirteen documented event paths, POST-only, JSON. Verified live on
    2026-08-12: an anonymous POST to /orders/create returns HTTP 401
    {"msg":"please send in header [x-shop-domain]"}. No signature, no retry policy
    and no delivery guarantee is documented.
  humanURL: https://developer.converted.in/api-1/webhooks
  baseURL: https://app.converted.in/api/webhooks/api
  tags:
  - Webhook
  - E-Commerce
  - Event
  tags_raw:
  - Webhooks
  - E-commerce
  - Events
  properties:
  - type: Documentation
    url: https://developer.converted.in/api-1/webhooks
  - type: Webhooks
    url: asyncapi/pinoffer-webhooks.yml
- name: Convertedin Store Connector API
  description: >-
    The contract a merchant on a custom e-commerce platform IMPLEMENTS so that
    Convertedin can pull its catalogue and customer data. Convertedin is the
    client here, not the server, which is why the base URL is the merchant's own
    host. Four documented POST endpoints — /convertedin/storeinfo, /categories,
    /products, /customers, /orders — authenticated by a fixed `token` field in a
    multipart form body, with page-number pagination (`page`, `per_page`) and a
    Laravel-style paginator response envelope.
  humanURL: https://developer.converted.in/api-1/getting-started
  baseURL: '{store_base_url}/convertedin'
  tags:
  - E-Commerce
  - Data Sync
  tags_raw:
  - E-commerce
  - Data Sync
  properties:
  - type: Documentation
    url: https://developer.converted.in/api-1/getting-started
  - type: GettingStarted
    url: https://developer.converted.in/api-1/getting-started
- name: Convertedin Loyalty & POS Integration API
  description: >-
    A second merchant-implemented contract, aimed at loyalty and point-of-sale
    vendors. GET endpoints for /api/store-info, /api/products, /api/orders and
    /api/customers on the vendor's own host, authenticated with a non-standard
    `Access-Token` header and paginated with `page` and `limit`. Documented
    separately from, and inconsistently with, the Store Connector API.
  humanURL: https://developer.converted.in/loyalty-and-pos-integration/store-info
  baseURL: '{store_base_url}/api'
  tags:
  - E-Commerce
  - Loyalty
  - Point-of-Sale
  tags_raw:
  - E-commerce
  - Loyalty
  - Point of Sale
  properties:
  - type: Documentation
    url: https://developer.converted.in/loyalty-and-pos-integration/store-info
