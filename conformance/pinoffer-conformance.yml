- id: llms-txt
  conforms: true
  evidence: >-
    https://developer.converted.in/llms.txt returns HTTP 200, text/plain, and is a
    valid llms.txt index of 31 documentation pages. Every page is also available
    as Markdown by appending `.md`. This is the single strongest agent-readable
    artifact Convertedin publishes; saved verbatim to llms/pinoffer-llms.txt.
- id: pagination
  conforms: true
  partial: true
  evidence: >-
    Page-number pagination is documented on both read contracts, but with
    different parameter names (`per_page` vs `limit`) and different response
    envelopes. See conventions/pinoffer-conventions.yml.
- id: idempotency
  conforms: false
  evidence: >-
    No idempotency key, dedupe key, or at-most-once guarantee is documented on any
    surface, including the webhook ingest API where retries are most likely.
- id: webhook-signing
  conforms: false
  evidence: >-
    Webhook deliveries are authenticated with a static `token` header and an
    `X-Shop-Domain` header. No HMAC signature, no timestamp, no replay protection.
- id: gdpr
  conforms: claimed
  certified: false
  evidence: >-
    "General Data Protection Regulation — Convertedin fully supports the privacy
