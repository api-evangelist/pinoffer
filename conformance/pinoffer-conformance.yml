standards:
- id: oauth2
  conforms: false
  evidence: >-
    No OAuth 2.0 surface. All four documented credentials are static shared
    secrets (see authentication/pinoffer-authentication.yml). /.well-known/oauth-authorization-server
    returned 404 on every host.
- id: oidc
  conforms: false
  evidence: /.well-known/openid-configuration returned 404 on every Convertedin host (probed 2026-08-12).
- id: rfc6750-bearer
  conforms: false
  evidence: >-
    Credentials are carried as a form-data field (`token`), a bare `token` header,
    an `Access-Token` header, and a URL query parameter — none is
    `Authorization: Bearer`.
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    Observed error body is `{"msg": "..."}` with content-type application/json,
    not application/problem+json, and carries no type/title/status/detail members.
    Some errors return HTML instead. See errors/pinoffer-problem-types.yml.
- id: rfc9116-security-txt
  conforms: false
  evidence: /.well-known/security.txt returned 404 on all of app.converted.in, developer.converted.in, converted.in and convertedin.com.
- id: rfc8594-sunset-header
  conforms: false
  evidence: No Sunset or Deprecation header and no deprecation policy is published.
- id: rfc9615-api-catalog
  conforms: false
  evidence: /.well-known/api-catalog returned 404 on every host.
- id: openapi
  conforms: false
  evidence: >-
    Full contract-discovery sweep on 2026-08-12 — /openapi.json, /openapi.yaml,
    /swagger.json, /v1/openapi.json, /api-docs, /redoc against app.converted.in,
    developer.converted.in, convertedin.com, converted.in and
