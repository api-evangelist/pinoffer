- id: mcp
  conforms: false
  evidence: No hosted or remote MCP server is published, and there is no OpenAPI from which to derive candidate tools.
- id: a2a-agent-card
  conforms: false
  evidence: >-
    /.well-known/agent-card.json and /.well-known/agent.json returned 404 on every
